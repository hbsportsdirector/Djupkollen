<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samlingen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --ink:#2b2340; --muted:#7a7090; --card:#ffffff; --line:#efe3cf;
  --sun:#ffcf3f; --sun-d:#f2b705; --berry:#ff5d73; --sky:#4cb6ff; --mint:#38d39f; --grape:#8a6cff;
  --radius:18px; --shadow:0 6px 0 rgba(43,35,64,.08), 0 10px 24px rgba(43,35,64,.08);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(circle at 12px 12px, rgba(255,207,63,.25) 2px, transparent 2.5px);
  background-size:28px 28px; min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 90px}

/* Header */
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.logo{width:52px;height:52px;flex:none}
h1{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1;margin:0;letter-spacing:-.5px}
h1 small{display:block;font-family:Nunito;font-weight:700;font-size:14px;color:var(--muted);letter-spacing:0;margin-top:4px}
.top .spacer{flex:1}
.iconbtn{border:2px solid var(--line);background:#fff;border-radius:14px;width:44px;height:44px;display:grid;place-items:center;font-size:20px}
.iconbtn:hover{border-color:var(--sun)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);border:2px solid var(--line)}
.stat b{display:block;font-family:"Baloo 2";font-size:28px;line-height:1.05}
.stat span{font-size:13px;font-weight:700;color:var(--muted)}
.stat.a b{color:var(--sky)} .stat.b b{color:var(--berry)} .stat.f b{color:var(--sun-d)}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}

/* Tabs + filters */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;max-width:220px;border:none;background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;box-shadow:var(--shadow);border:2px solid var(--line)}
.tab[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;outline:none}
.search:focus{border-color:var(--sun)}
select.sort{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--sun);border-color:var(--sun-d)}
.chip .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.tile{background:#fff;border-radius:16px;border:2px solid var(--line);box-shadow:var(--shadow);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .12s}
.tile:hover{transform:translateY(-3px) rotate(-.5deg)}
.tile .pic{aspect-ratio:63/88;background:var(--tc,#ddd);position:relative;overflow:hidden}
.tile .pic img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:44px;color:rgba(255,255,255,.85)}
.tile .star{position:absolute;top:6px;right:6px;font-size:20px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.tile .qty{position:absolute;top:6px;left:6px;background:var(--ink);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:2px 8px}
.tile .meta{padding:8px 10px 10px}
.tile .nm{font-weight:800;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .sub{font-size:12px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val{display:inline-block;margin-top:5px;font-size:12px;font-weight:800;background:#eafaf2;color:#13784f;border-radius:999px;padding:2px 8px}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;margin-top:6px;color:#fff}
.b-a{background:var(--sky)} .b-b{background:var(--berry)} .b-both{background:var(--grape)}

.empty{text-align:center;padding:40px 16px;color:var(--muted);font-weight:700}
.empty .big{font-size:52px}
.note{background:#fff;border:2px dashed var(--sun-d);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;margin-bottom:14px}

/* FAB */
.fab{position:fixed;right:18px;bottom:18px;border:none;background:var(--berry);color:#fff;font-family:"Baloo 2";font-weight:800;font-size:18px;padding:14px 20px;border-radius:999px;box-shadow:0 6px 0 #c23a4f,0 12px 24px rgba(0,0,0,.18);z-index:5}
.fab:active{transform:translateY(3px);box-shadow:0 3px 0 #c23a4f}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(43,35,64,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.backdrop.open{display:flex}
@media (min-width:700px){.backdrop{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 24px}
@media (min-width:700px){.sheet{border-radius:24px}}
.sheet h2{font-family:"Baloo 2";font-size:26px;margin:0 0 12px;line-height:1.1}
.sheet .x{float:right}
.detail{display:grid;grid-template-columns:200px 1fr;gap:16px}
@media (max-width:520px){.detail{grid-template-columns:1fr}}
.detail .pic{aspect-ratio:63/88;border-radius:14px;overflow:hidden;background:var(--tc,#ddd);position:relative;max-width:260px;margin:0 auto;width:100%}
.detail .pic img{width:100%;height:100%;object-fit:cover}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 12px;font-size:15px}
dt{color:var(--muted);font-weight:700}
dd{margin:0;font-weight:700}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-weight:800}
.btn.primary{background:var(--sun);border-color:var(--sun-d)}
.btn.danger{color:#c23a4f}
.btn:disabled{opacity:.5;cursor:default}
form .f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
form label{font-weight:800;font-size:14px}
form input[type=text],form input[type=password],form input[type=number],form select,form textarea{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;outline:none;width:100%}
form input:focus,form select:focus,form textarea:focus{border-color:var(--sun)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:800}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.drop{border:2px dashed var(--muted);border-radius:14px;padding:14px;text-align:center;font-weight:700;color:var(--muted);background:#fff;cursor:pointer;display:block}
.drop img{max-height:180px;border-radius:10px;display:block;margin:0 auto 6px}
.err{color:#c23a4f;font-weight:800;font-size:14px;min-height:1em}
.hint{color:var(--muted);font-weight:700;font-size:14px;margin:4px 0 0}
.check{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;margin:4px 0 12px}

/* Set checklist */
.setcard{background:#fff;border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.setcard h3{font-family:"Baloo 2";font-size:22px;margin:0;line-height:1.1}
.setcard .code{color:var(--muted);font-weight:800;font-size:13px}
.big{font-family:"Baloo 2";font-weight:800}
.prog{display:flex;align-items:baseline;gap:8px;margin:8px 0 6px}
.prog b{font-family:"Baloo 2";font-size:30px;line-height:1}
.prog span{color:var(--muted);font-weight:800}
.bar{height:14px;background:#f1e8d8;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:999px}
.subprog{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;font-weight:700;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px;margin-top:12px}
.slot{border-radius:12px;aspect-ratio:63/88;position:relative;overflow:hidden;padding:0;text-align:left;border:2px dashed #d9ccb4;background:#fbf6ec;display:flex;flex-direction:column;justify-content:space-between}
.slot .n{font-family:"Baloo 2";font-weight:800;font-size:15px;padding:4px 6px 0;color:#b3a588}
.slot .sn{font-size:10.5px;font-weight:700;color:#9a8f7a;padding:0 6px 6px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.slot .rt{position:absolute;top:5px;right:5px;font-size:9.5px;font-weight:800;background:#efe3cf;color:#7a6a4d;border-radius:6px;padding:1px 5px}
.slot.have{border:2px solid var(--mint);background:#fff}
.slot.have img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.have .n{position:absolute;left:4px;bottom:4px;background:rgba(43,35,64,.85);color:#fff;border-radius:8px;padding:0 6px;font-size:12px}
.slot.have .ok{position:absolute;top:4px;right:4px;background:var(--mint);color:#fff;border-radius:999px;width:20px;height:20px;display:grid;place-items:center;font-size:12px;font-weight:900}
.slot.wish{border-color:var(--grape);background:#f4f0ff}
.slot.wish .n{color:var(--grape)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.ai{border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;margin-top:8px;background:#eef6ff;border:2px solid #cfe5ff}
.ai.ok{background:#eafaf2;border-color:#bfead6}.ai.bad{background:#fff1f1;border-color:#f6caca}
.ai .btn{margin-top:8px}
.slot .sv{font-size:10px;font-weight:800;color:#13784f;padding:0 6px 4px}
.slot.have .sv{position:absolute;right:4px;bottom:4px;background:#eafaf2;border-radius:6px;padding:0 4px}
select.mini{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-weight:700;font-size:14px;flex:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="29" fill="#ffcf3f" stroke="#2b2340" stroke-width="4"/>
      <path d="M32 12l5.6 12.4 13.4 1.4-10 9.1 2.9 13.2L32 41.4 20.1 48.1 23 34.9l-10-9.1 13.4-1.4z" fill="#fff" stroke="#2b2340" stroke-width="3" stroke-linejoin="round"/>
    </svg>
    <h1 id="title">Samlingen</h1>
    <div class="spacer"></div>
    <button class="iconbtn" id="lockBtn" title="Logga in för att ändra" aria-label="Logga in eller inställningar">🔒</button>
  </header>

  <div id="status" class="note" hidden></div>

  <section class="stats" aria-label="Statistik">
    <div class="stat"><b id="sTotal">0</b><span>kort totalt</span></div>
    <div class="stat a"><b id="sA">0</b><span>olika kort</span></div>
    <div class="stat b"><b id="sB">0</b><span>ca värde</span></div>
    <div class="stat f"><b id="sFav">0</b><span>favoriter ⭐</span></div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="har" aria-selected="true">📚 Samlingen</button>
    <button class="tab" role="tab" data-tab="onskar" aria-selected="false">✨ Önskelistan</button>
    <button class="tab" role="tab" data-tab="set" aria-selected="false">📖 Setlista</button>
  </div>

  <div class="filters">
    <div class="row">
      <input class="search" id="q" type="search" placeholder="Sök kort, set eller nummer…">
      <select class="sort" id="sort" aria-label="Sortera">
        <option value="new">Nyast först</option>
        <option value="name">Namn A–Ö</option>
        <option value="hp">Högst HP</option>
        <option value="value">Mest värd</option>
        <option value="rarity">Sällsyntast</option>
        <option value="set">Set &amp; nummer</option>
      </select>
    </div>
    <div class="chips" id="typeChips"></div>
    <div class="chips" id="setChips" hidden></div>
  </div>

  <div class="grid" id="grid"></div>
  <div id="setView" hidden></div>
  <div class="empty" id="empty" hidden></div>
</div>

<button class="fab" id="addBtn" hidden>＋ Lägg till kort</button>

<!-- Detail -->
<div class="backdrop" id="slotM"><div class="sheet" role="dialog" aria-modal="true" id="slotBody"></div></div>
<div class="backdrop" id="detailM"><div class="sheet" role="dialog" aria-modal="true" id="detailBody"></div></div>
<!-- Form -->
<div class="backdrop" id="formM"><div class="sheet" role="dialog" aria-modal="true">
  <button class="iconbtn x" data-close>✕</button>
  <h2 id="formTitle">Nytt kort</h2>
  <form id="cardForm" autocomplete="off">
    <div class="f">
      <label class="drop" id="drop">
        <span id="dropInner">📷 Tryck för att välja en bild på kortet</span>
        <input type="file" id="file" accept="image/*" hidden>
      </label>
      <div class="ai" id="aiBox" hidden></div>
    </div>
    <div class="f"><label for="fName">Namn *</label><input type="text" id="fName" required maxlength="60" placeholder="t.ex. Pikachu"></div>
    <div class="two">
      <div class="f"><label for="fType">Typ</label><select id="fType"></select></div>
      <div class="f"><label for="fHp">HP</label><input type="number" id="fHp" min="0" max="999" step="10"></div>
    </div>
    <div class="two">
      <div class="f"><label for="fSet">Set / expansion</label><input type="text" id="fSet" maxlength="60"></div>
      <div class="f"><label for="fNum">Nummer</label><input type="text" id="fNum" maxlength="20" placeholder="t.ex. 25/165"></div>
    </div>
    <div class="two">
      <div class="f"><label for="fRar">Sällsynthet</label><select id="fRar"></select></div>
      <div class="f"><label for="fCount">Antal</label><input type="number" id="fCount" min="1" max="99" value="1"></div>
    </div>
    <div class="f"><label for="fVal">Värde per kort (kr, ungefär)</label><input type="number" id="fVal" min="0" step="1"></div>
    <div class="f"><label>Har vi det?</label><div class="seg" id="fStatus"></div></div>
    <div class="f"><label for="fNote">Anteckning</label><textarea id="fNote" rows="2" maxlength="300" placeholder="t.ex. Fick av mormor 🎁"></textarea></div>
    <div class="err" id="formErr"></div>
    <div class="btns"><button class="btn primary" type="submit" id="saveBtn">Spara kortet</button><button class="btn" type="button" data-close>Avbryt</button></div>
  </form>
</div></div>
<!-- Settings -->
<div class="backdrop" id="setM"><div class="sheet" role="dialog" aria-modal="true">
  <button class="iconbtn x" data-close>✕</button>
  <h2>Inställningar</h2>
  <form id="pwForm" autocomplete="off">
    <div class="f"><label for="oldPw">Nuvarande lösenord</label><input type="password" id="oldPw" autocomplete="current-password" required></div>
    <div class="f"><label for="newPw">Nytt lösenord (minst 6 tecken)</label><input type="password" id="newPw" autocomplete="new-password" minlength="6" required></div>
    <div class="err" id="setErr"></div>
    <div class="btns"><button class="btn primary" type="submit">Byt lösenord</button><button class="btn" type="button" id="logoutBtn">Logga ut</button></div>
  </form>
</div></div>
<!-- Login -->
<div class="backdrop" id="loginM"><div class="sheet" role="dialog" aria-modal="true">
  <button class="iconbtn x" data-close>✕</button>
  <h2>🔒 Logga in</h2>
  <div id="loginBox">
    <form id="loginForm">
      <div class="f"><label for="loginPw">Lösenord</label><input type="password" id="loginPw" autocomplete="current-password" required></div>
      <label class="check"><input type="checkbox" id="remember" checked> Kom ihåg mig på den här enheten</label>
      <div class="btns"><button class="btn primary" type="submit" id="loginBtn">Logga in</button></div>
    </form>
  </div>
  <div id="setupBox" hidden>
    <p class="hint">Första gången: skriv startkoden du fick och välj ett eget lösenord.</p>
    <form id="setupForm" autocomplete="off">
      <div class="f"><label for="setupCode">Startkod</label><input type="text" id="setupCode" required></div>
      <div class="f"><label for="setupPw">Välj lösenord (minst 6 tecken)</label><input type="password" id="setupPw" autocomplete="new-password" minlength="6" required></div>
      <div class="btns"><button class="btn primary" type="submit">Spara lösenord</button></div>
    </form>
  </div>
  <div class="err" id="loginErr"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>(function(){
const SB="https://abwmdhvaxqlpyzgvuedj.supabase.co", KEY="sb_publishable_R1OuxhyY7HJq68XcEoFnSw_Zl16Gux9";
const TYPES=[["Gräs","#4fbf5a"],["Eld","#ff7a3d"],["Vatten","#3c9dff"],["Blixt","#f5c400"],["Psykisk","#b65ce0"],["Kamp","#c46a3a"],["Mörker","#4a4560"],["Metall","#8c9aa8"],["Drake","#c9a227"],["Fe","#ff8fc8"],["Färglös","#b8ae9c"],["Tränare","#2fb3a6"],["Energi","#6d7bff"]];
const TC=Object.fromEntries(TYPES);
const RAR=["Vanlig","Ovanlig","Sällsynt","Holo","Ultra (ex/V/GX)","Illustration","Hemlig/Guld"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let sets=[], setCards=[], setFilter="all", setSort="num", aiData=null, cards=[], imgs={}, st={tab:"har",type:"all",q:"",sort:"value"}, editing=null, pendingImg=null;
let pw=null; try{pw=sessionStorage.getItem("pkpw")||localStorage.getItem("pkpw")}catch(_){}

/* ---------- API ---------- */
async function rest(path){const r=await fetch(SB+"/rest/v1/"+path,{headers:{apikey:KEY},cache:"no-store"});if(!r.ok)throw new Error("Kunde inte hämta data");return r.json()}
async function rpc(fn,args){
  const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(_){}
  if(!r.ok){const m=(j&&(j.message||j.hint))||"Något gick fel";const e=new Error(m);e.code=j&&j.code;throw e}
  return j;
}
function pwErr(e){if(e&&e.code==="28P01"&&/lösenord/i.test(e.message)){logout(true)}return e&&e.message||"Något gick fel"}

/* ---------- helpers ---------- */
function kr(n){return Math.round(n).toLocaleString("sv-SE")+" kr"}
function sum(a){return a.reduce((s,c)=>s+(Number(c.count)||1),0)}
function src(c){if(!c.img)return"";if(c.img.startsWith("db:"))return imgs[c.img.slice(3)]||"";return c.img}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2400)}
function open(sel){$(sel).classList.add("open")}
function close(sel){$(sel).classList.remove("open")}
function status(t){const e=$("#status");if(t){e.textContent=t;e.hidden=false}else e.hidden=true}

/* ---------- render ---------- */
function renderAuth(){
  const on=!!pw;
  $("#addBtn").hidden=!on;
  $("#lockBtn").textContent=on?"⚙️":"🔒";
  $("#lockBtn").title=on?"Inställningar":"Logga in för att ändra";
}
function renderStats(){const h=cards.filter(c=>(c.status||"har")==="har");
  $("#sTotal").textContent=sum(h);$("#sA").textContent=h.length;
  $("#sB").textContent=kr(h.reduce((s,c)=>s+(Number(c.value_sek)||0)*(Number(c.count)||1),0));

    const slots=shown.map(x=>{const v=kr2(x),vt=v!=null?`<span class="sv">≈${v} kr</span>`:"";const k=code+"#"+x.number,h=have[k],w=wish[k],num=String(x.number).padStart(3,"0");

    return `<div class="setcard"><div class="code">${esc(S.code)} · ${S.total} kort</div><h3>${esc(S.name)}</h3>

      <div class="slots">${slots||'<p class="hint">Inga kort här.</p>'}</div></div>`}).join("")+
    `<p class="hint" style="text-align:center">Kort från andra set (t.ex. Abyss Eye) syns i Samlingen men har ingen setlista än.</p>`;
}

async function load(){

    const need=rows.filter(c=>c.img&&c.img.startsWith("db:")).map(c=>c.img.slice(3)).filter(id=>!imgs[id]);
    if(need.length){const im=await rest("pokemon_images?select=id,data&id=in.("+need.join(",")+")");im.forEach(i=>imgs[i.id]=i.data)}
    if(!sets.length){try{sets=await rest("pokemon_sets?select=*&order=code");setCards=await rest("pokemon_set_cards?select=*&order=set_code,number")}catch(_){}}
    cards=rows;status("");render();

  }catch(e){status("Kunde inte ladda samlingen just nu. Försök igen om en stund.")}
}

function loadImg(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
function toJpeg(img,box,max,limit){const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;
  let sx=0,sy=0,sw=W,sh=H;if(box){const m=.015;sx=Math.max(0,(box.x0-m)*W);sy=Math.max(0,(box.y0-m)*H);sw=Math.min(W,(box.x1+m)*W)-sx;sh=Math.min(H,(box.y1+m)*H)-sy}
  const k=Math.min(1,max/Math.max(sw,sh)),w=Math.round(sw*k),h=Math.round(sh*k);const cv=document.createElement("canvas");cv.width=w;cv.height=h;
  cv.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,w,h);let q=.85,d=cv.toDataURL("image/jpeg",q);while(d.length>limit&&q>.4){q-=.1;d=cv.toDataURL("image/jpeg",q)}return d}

  }catch(err){ai("😕 "+esc(err.message||"Kunde inte känna igen kortet")+" – fyll i själv, eller prova en bild med mindre reflexer.","bad")}

  catch(err){$("#loginErr").textContent=err.message||"Fel lösenord"}finally{b.disabled=false}});
$("#setupForm").addEventListener("submit",async e=>{e.preventDefault();const code=$("#setupCode").value.trim(),p=$("#setupPw").value;
  try{await rpc("pokemon_set_password",{old_pw:code,new_pw:p});pw=p;try{localStorage.setItem("pkpw",p)}catch(_){}
    close("#loginM");toast("Lösenordet är sparat 🔒");render()}catch(err){$("#loginErr").textContent=err.message}});
$("#pwForm").addEventListener("submit",async e=>{e.preventDefault();const o=$("#oldPw").value,n=$("#newPw").value;
  try{await rpc("pokemon_set_password",{old_pw:o,new_pw:n});pw=n;try{if(localStorage.getItem("pkpw"))localStorage.setItem("pkpw",n);else sessionStorage.setItem("pkpw",n)}catch(_){}
    close("#setM");toast("Nytt lösenord sparat")}catch(err){$("#setErr").textContent=err.message}});
$("#logoutBtn").addEventListener("click",()=>{close("#setM");logout()});

/* ---------- misc ---------- */
document.addEventListener("click",e=>{if(e.target.closest("[data-close]")){e.target.closest(".backdrop").classList.remove("open");return}
  if(e.target.classList.contains("backdrop"))e.target.classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".backdrop.open").forEach(b=>b.classList.remove("open"))});
function syncTabs(){document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===st.tab))}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{st.tab=t.dataset.tab;st.type="all";syncTabs();render()}));
$("#typeChips").addEventListener("click",e=>{const b=e.target.closest("[data-type]");if(b){st.type=b.dataset.type;render()}});
$("#q").addEventListener("input",e=>{st.q=e.target.value;render()});
$("#sort").addEventListener("change",e=>{st.sort=e.target.value;render()});
$("#grid").addEventListener("click",e=>{const t=e.target.closest(".tile");if(t)openDetail(t.dataset.id)});
$("#addBtn").addEventListener("click",()=>openForm(null));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
$("#sort").value="value";
if(pw)rpc("pokemon_login",{pw}).catch(()=>logout(true));
render();load();
})();
</script>
</body>
</html>
